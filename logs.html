<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT LOGS — YOU WEB BOT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&display=swap');

:root {
  --bg:       #050b14;
  --surface:  #0a1220;
  --border:   #1c2a40;
  --cyan:     #00cfff;
  --green:    #00ffa6;
  --yellow:   #ffd64d;
  --red:      #ff4d6d;
  --orange:   #ff8c42;
  --muted:    #3a5070;
  --text:     #c5d5e8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 5% 95%, #00ffa608 0%, transparent 45%),
    radial-gradient(ellipse at 95% 5%,  #00cfff08 0%, transparent 45%),
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
  background-attachment: fixed;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: rgba(10,18,32,.95);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1.5px solid var(--cyan);
  object-fit: cover;
  box-shadow: 0 0 12px #00cfff30;
}
.header-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px; font-weight: 700; letter-spacing: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-sub { font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-top: 2px; }

.header-right { display: flex; align-items: center; gap: 10px; }

.live-badge {
  display: flex; align-items: center; gap: 6px;
  background: #00ffa610; border: 1px solid #00ffa630;
  border-radius: 20px; padding: 5px 12px;
  font-size: 11px; color: var(--green); letter-spacing: 1px;
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }

.btn-clear {
  background: rgba(255,77,109,.1); border: 1px solid rgba(255,77,109,.3);
  color: var(--red); border-radius: 10px; padding: 6px 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  cursor: pointer; transition: .2s; letter-spacing: 1px;
}
.btn-clear:hover { background: rgba(255,77,109,.2); }

.btn-home {
  background: rgba(0,207,255,.08); border: 1px solid rgba(0,207,255,.25);
  color: var(--cyan); border-radius: 10px; padding: 6px 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  cursor: pointer; transition: .2s; letter-spacing: 1px; text-decoration: none;
  display: flex; align-items: center; gap: 6px;
}
.btn-home:hover { background: rgba(0,207,255,.15); }

/* ── STATS BAR ── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 14px 20px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: .2s;
}
.stat-card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent, rgba(0,207,255,.03));
  pointer-events: none;
}
.stat-card:hover { border-color: var(--cyan); transform: translateY(-2px); }

.stat-icon { font-size: 18px; margin-bottom: 6px; }
.stat-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px; font-weight: 700;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stat-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-top: 3px; }

/* ── TERMINAL ── */
.terminal-wrap {
  margin: 0 20px 20px;
  background: #020810;
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 40px #00cfff08, inset 0 0 60px #00000040;
}

.terminal-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.terminal-dots { display: flex; gap: 6px; }
.dot-red   { width:12px;height:12px;border-radius:50%;background:#ff5f57; }
.dot-yellow{ width:12px;height:12px;border-radius:50%;background:#febc2e; }
.dot-green { width:12px;height:12px;border-radius:50%;background:#28c840; }

.terminal-title {
  font-size: 11px; color: var(--muted); letter-spacing: 2px;
  display: flex; align-items: center; gap: 8px;
}
.terminal-title i { color: var(--cyan); }

.terminal-cmd {
  font-size: 10px; color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.terminal-cmd span { color: var(--green); }

.terminal-body {
  height: 420px;
  overflow-y: auto;
  padding: 14px 16px;
  scroll-behavior: smooth;
}
.terminal-body::-webkit-scrollbar { width: 4px; }
.terminal-body::-webkit-scrollbar-track { background: transparent; }
.terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* LOG LINES */
.log-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 3px 0;
  font-size: 12px;
  line-height: 1.6;
  animation: fadeIn .3s ease;
  border-left: 2px solid transparent;
  padding-left: 8px;
  margin-bottom: 2px;
}
@keyframes fadeIn { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:none} }

.log-line.INF  { border-color: var(--cyan);   }
.log-line.WRN  { border-color: var(--yellow); }
.log-line.ERR  { border-color: var(--red);    background: rgba(255,77,109,.04); }
.log-line.SUC  { border-color: var(--green);  }
.log-line.SYS  { border-color: var(--muted);  }

.log-time { color: var(--muted); font-size: 10px; flex-shrink: 0; min-width: 75px; }

.log-badge {
  font-size: 9px; font-weight: 700; letter-spacing: 1px;
  padding: 1px 7px; border-radius: 4px; flex-shrink: 0;
}
.badge-INF { background: rgba(0,207,255,.15); color: var(--cyan); }
.badge-WRN { background: rgba(255,214,77,.15); color: var(--yellow); }
.badge-ERR { background: rgba(255,77,109,.15); color: var(--red); }
.badge-SUC { background: rgba(0,255,166,.15);  color: var(--green); }
.badge-SYS { background: rgba(58,80,112,.3);   color: var(--muted); }

.log-text { flex: 1; color: var(--text); word-break: break-all; }
.log-text .hi-green  { color: var(--green); }
.log-text .hi-cyan   { color: var(--cyan); }
.log-text .hi-yellow { color: var(--yellow); }
.log-text .hi-red    { color: var(--red); }
.log-text .hi-white  { color: #fff; }

/* cursor blink */
.cursor {
  display: inline-block; width: 8px; height: 14px;
  background: var(--cyan); vertical-align: middle;
  animation: blink 1s infinite; margin-left: 4px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── USERS PANEL ── */
.users-panel {
  margin: 0 20px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px; overflow: hidden;
}
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,.2);
}
.panel-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px; letter-spacing: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.panel-count {
  font-size: 11px; color: var(--green);
  background: rgba(0,255,166,.1); border: 1px solid rgba(0,255,166,.2);
  border-radius: 20px; padding: 3px 12px;
}

.users-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

.user-row {
  display: flex; align-items: center; gap: 12px;
  background: rgba(0,0,0,.3); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 14px;
  transition: .2s; animation: fadeIn .3s ease;
}
.user-row:hover { border-color: var(--cyan); background: rgba(0,207,255,.04); }

.user-avatar {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--cyan), var(--green));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: var(--bg); flex-shrink: 0;
}
.user-info { flex: 1; }
.user-num  { font-size: 13px; color: #fff; letter-spacing: 1px; }
.user-since{ font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }

.user-status {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--green); letter-spacing: 1px;
}
.user-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); animation: pulse 2s infinite;
}

.no-users {
  text-align: center; padding: 30px;
  color: var(--muted); font-size: 12px; letter-spacing: 2px;
}
.no-users i { font-size: 24px; display: block; margin-bottom: 10px; opacity: .4; }

/* ── FOOTER ── */
.footer {
  text-align: center; padding: 16px;
  font-size: 10px; color: var(--muted); letter-spacing: 2px;
}

/* Mobile */
@media(max-width:500px){
  .stats-bar { grid-template-columns: repeat(2,1fr); }
  .terminal-body { height: 320px; }
  .stat-value { font-size: 16px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <img src="https://i.postimg.cc/tgN7HVPg/image.png" class="logo">
    <div>
      <div class="header-title">YOU WEB BOT</div>
      <div class="header-sub">LOGS DASHBOARD</div>
    </div>
  </div>
  <div class="header-right">
    <div class="live-badge"><span class="live-dot"></span> LIVE</div>
    <button class="btn-clear" onclick="clearLogs()"><i class="fa-solid fa-trash"></i> CLEAR</button>
    <a href="/" class="btn-home"><i class="fa-solid fa-house"></i> HOME</a>
  </div>
</div>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-icon">🤖</div>
    <div class="stat-value" id="statSessions">0</div>
    <div class="stat-label">SESSIONS</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">👥</div>
    <div class="stat-value" id="statUsers">0</div>
    <div class="stat-label">CONNECTÉS</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">📋</div>
    <div class="stat-value" id="statLines">0</div>
    <div class="stat-label">LIGNES LOG</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">❌</div>
    <div class="stat-value" id="statErrors" style="background:linear-gradient(90deg,#ff4d6d,#ff8c42);-webkit-background-clip:text;-webkit-text-fill-color:transparent">0</div>
    <div class="stat-label">ERREURS</div>
  </div>
</div>

<!-- TERMINAL -->
<div class="terminal-wrap">
  <div class="terminal-bar">
    <div class="terminal-dots">
      <div class="dot-red"></div>
      <div class="dot-yellow"></div>
      <div class="dot-green"></div>
    </div>
    <div class="terminal-title">
      <i class="fa-solid fa-terminal"></i>
      bot.log — auto-refresh
    </div>
    <div class="terminal-cmd">
      $ <span>tail -f /var/log/bot.log</span>
    </div>
  </div>
  <div class="terminal-body" id="terminal">
    <div class="log-line SYS">
      <span class="log-time" id="initTime"></span>
      <span class="log-badge badge-SYS">SYS</span>
      <span class="log-text">Dashboard initialisé — connexion au serveur...</span>
    </div>
  </div>
</div>

<!-- USERS PANEL -->
<div class="users-panel">
  <div class="panel-header">
    <div class="panel-title">SESSIONS ACTIVES</div>
    <div class="panel-count" id="usersCount">0 connecté(s)</div>
  </div>
  <div class="users-list" id="usersList">
    <div class="no-users">
      <i class="fa-solid fa-robot"></i>
      Aucune session active
    </div>
  </div>
</div>

<div class="footer">YOU WEB BOT © 2026 — LIVE LOG SYSTEM</div>

<script>
// =============================================
// CONFIG — change si besoin
// =============================================
const REFRESH_LOGS  = 3000;   // ms entre chaque fetch logs
const REFRESH_USERS = 5000;   // ms entre chaque fetch users
const MAX_LINES     = 200;    // max lignes dans le terminal

// =============================================
// STATE
// =============================================
let logLines   = [];
let errorCount = 0;
let lineCount  = 0;
let userCount  = 0;
let sessionCount = 0;
let lastLogId  = 0; // pour ne pas réafficher les anciens logs

// =============================================
// UTILS
// =============================================
function now() {
  return new Date().toLocaleTimeString('fr-FR', { hour12: false });
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function colorize(text) {
  let t = escapeHtml(text);
  // highlights
  t = t.replace(/\b(✅|SUCCESS|LOADED|READY|ACTIVE|ON|ENABLED|STARTED)\b/g,  '<span class="hi-green">$1</span>');
  t = t.replace(/\b(ERROR|ERR|FAILED|CRASH|LOGGED_OUT)\b/g,                   '<span class="hi-red">$1</span>');
  t = t.replace(/\b(WARN|WRN|WARNING|LIMITED)\b/g,                            '<span class="hi-yellow">$1</span>');
  t = t.replace(/(\d{9,})/g,                                                   '<span class="hi-cyan">$1</span>');
  t = t.replace(/\[(.*?)\]/g,                                                  '[<span class="hi-white">$1</span>]');
  return t;
}

function levelOf(text) {
  const u = text.toUpperCase();
  if (u.includes('ERR') || u.includes('CRASH') || u.includes('LOGGED_OUT')) return 'ERR';
  if (u.includes('WRN') || u.includes('WARN'))  return 'WRN';
  if (u.includes('✅') || u.includes('SUCCESS') || u.includes('READY') || u.includes('LOADED')) return 'SUC';
  if (u.includes('INF') || u.includes('INFO'))  return 'INF';
  return 'SYS';
}

// =============================================
// RENDER LOG LINE
// =============================================
function addLogLine(text, level) {
  const terminal = document.getElementById('terminal');
  const lvl = level || levelOf(text);
  if (lvl === 'ERR') { errorCount++; document.getElementById('statErrors').textContent = errorCount; }

  lineCount++;
  document.getElementById('statLines').textContent = lineCount;

  const div = document.createElement('div');
  div.className = `log-line ${lvl}`;
  div.innerHTML = `
    <span class="log-time">${now()}</span>
    <span class="log-badge badge-${lvl}">${lvl}</span>
    <span class="log-text">${colorize(text)}</span>
  `;
  terminal.appendChild(div);

  // Limite les lignes affichées
  const all = terminal.querySelectorAll('.log-line');
  if (all.length > MAX_LINES) all[0].remove();

  // Auto scroll
  terminal.scrollTop = terminal.scrollHeight;
}

function clearLogs() {
  document.getElementById('terminal').innerHTML = '';
  lineCount = 0; errorCount = 0;
  document.getElementById('statLines').textContent = 0;
  document.getElementById('statErrors').textContent = 0;
  addLogLine('Terminal effacé par l\'utilisateur.', 'SYS');
}

// =============================================
// FETCH LOGS depuis /api/logs
// =============================================
async function fetchLogs() {
  try {
    const res  = await fetch(`/api/logs?since=${lastLogId}`);
    if (!res.ok) return;
    const data = await res.json();

    if (data.logs && Array.isArray(data.logs)) {
      data.logs.forEach(entry => {
        // entry peut être string ou { id, text, level }
        if (typeof entry === 'string') {
          addLogLine(entry);
        } else {
          if (entry.id > lastLogId) lastLogId = entry.id;
          addLogLine(entry.text || entry.message || JSON.stringify(entry), entry.level);
        }
      });
    }
  } catch (e) {
    // Serveur inaccessible — affiche une ligne d'erreur de connexion toutes les 30s
    if (!fetchLogs._lastWarn || Date.now() - fetchLogs._lastWarn > 30000) {
      addLogLine('⚠️ Impossible de joindre /api/logs — vérifiez le serveur', 'WRN');
      fetchLogs._lastWarn = Date.now();
    }
  }
}

// =============================================
// FETCH USERS depuis /api/sessions
// =============================================
async function fetchUsers() {
  try {
    const res  = await fetch('/api/sessions');
    if (!res.ok) return;
    const data = await res.json();

    const sessions = data.sessions || data.users || [];
    userCount    = sessions.length;
    sessionCount = data.total || sessions.length;

    document.getElementById('statUsers').textContent    = userCount;
    document.getElementById('statSessions').textContent = sessionCount;
    document.getElementById('usersCount').textContent   = `${userCount} connecté(s)`;

    renderUsers(sessions);
  } catch (e) {
    // silencieux
  }
}

// =============================================
// RENDER USERS
// =============================================
function renderUsers(sessions) {
  const list = document.getElementById('usersList');

  if (!sessions.length) {
    list.innerHTML = `<div class="no-users"><i class="fa-solid fa-robot"></i>Aucune session active</div>`;
    return;
  }

  list.innerHTML = sessions.map(s => {
    const num    = s.number || s.jid?.split('@')[0] || s.id || '???';
    const since  = s.connectedAt ? new Date(s.connectedAt).toLocaleTimeString('fr-FR') : 'inconnu';
    const letter = num[0]?.toUpperCase() || '?';
    return `
      <div class="user-row">
        <div class="user-avatar">${letter}</div>
        <div class="user-info">
          <div class="user-num">+${num}</div>
          <div class="user-since">Connecté depuis ${since}</div>
        </div>
        <div class="user-status">
          <span class="user-dot"></span> EN LIGNE
        </div>
      </div>
    `;
  }).join('');
}

// =============================================
// INIT TIME
// =============================================
document.getElementById('initTime').textContent = now();

// =============================================
// START POLLING
// =============================================
fetchLogs();
fetchUsers();
setInterval(fetchLogs,  REFRESH_LOGS);
setInterval(fetchUsers, REFRESH_USERS);

// Message de bienvenue dans le terminal
setTimeout(() => addLogLine('✅ Dashboard connecté au serveur YOU WEB BOT', 'SUC'), 800);
setTimeout(() => addLogLine('INF Écoute des logs en temps réel...', 'INF'), 1400);
</script>
</body>
</html>
